name: Tests

# Gate merges on the offline suites. Prompt 14 recon found docs-deploy was the
# only workflow, so nothing ran the tests this branch adds. Kept minimal and
# matching deploy-docs.yml conventions (pinned action SHAs, Node 20,
# least-privilege permissions).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-gso:
    name: Backend + GSO pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # uv provisions Python 3.12 (UV_PYTHON, overriding the runner's system
      # interpreter) and, via --frozen, the locked deps. Pinned because the
      # runner image's Python can outrun the lock's wheels: ubuntu-26.04 ships
      # 3.14, and whenever==0.7.3 has no cp314 wheel and cannot build from source.
      # scripts/test.sh runs both suites through `uv run --frozen --extra dev`
      # (the dev extra carries pytest-asyncio, which asyncio_mode=auto needs).
      # `uv lock --check` is deliberately NOT run: the GSO package version is
      # dynamic (git-describe), so it fails structurally on a clean tree.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: ./scripts/test.sh

  frontend:
    name: Frontend vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
