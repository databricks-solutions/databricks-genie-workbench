name: Tests

# Gate merges on the offline suites. Prompt 14 recon found docs-deploy was the
# only workflow, so nothing ran the tests this branch adds. Kept minimal and
# matching deploy-docs.yml conventions (pinned action SHAs, Node 20,
# least-privilege permissions).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-gso:
    name: Backend + GSO pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # uv provisions the pinned interpreter and, via --frozen, the locked deps.
      # scripts/test.sh runs both suites through `uv run --frozen --extra dev`
      # (the dev extra carries pytest-asyncio, which asyncio_mode=auto needs).
      # `uv lock --check` is deliberately NOT run: the GSO package version is
      # dynamic (git-describe), so it fails structurally on a clean tree.
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - run: ./scripts/test.sh

  frontend:
    name: Frontend vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
