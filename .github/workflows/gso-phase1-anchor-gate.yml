name: GSO Phase 1 Anchor Gate

# Phase 2.3 (2026-05-17) — refuse PRs that change Phase 1
# typed-contract files without passing the live-shape anchor
# fixtures and updating the stage-handoff contract doc.

on:
  pull_request:
    paths:
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/failure_cluster.py"
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/cluster_driven_synthesis.py"
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/forced_synthesis_dispatch.py"
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/harness.py"
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/decision_emitters.py"
      - "packages/genie-space-optimizer/src/genie_space_optimizer/optimization/run_analysis_contract.py"
      - "packages/genie-space-optimizer/docs/architecture/stage-handoff-contract.md"
      - "packages/genie-space-optimizer/tests/fixtures/failure_cluster_anchors/**"
      - "packages/genie-space-optimizer/tests/replay/active/test_phase1_anchor_clusters_typed_contract.py"
      - "packages/genie-space-optimizer/tests/unit/test_failure_cluster.py"
      - "packages/genie-space-optimizer/tests/unit/test_marker_refuse_on_empty.py"
      - ".github/workflows/gso-phase1-anchor-gate.yml"

jobs:
  anchor_tests:
    name: Phase 1 anchor fixtures + refuse-on-empty
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/genie-space-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - name: Run Phase 1 anchor + typed-contract tests
        run: |
          uv run pytest \
            tests/replay/active/test_phase1_anchor_clusters_typed_contract.py \
            tests/unit/test_failure_cluster.py \
            tests/unit/test_marker_refuse_on_empty.py \
            -v --tb=short

  doc_sync_check:
    name: Stage-handoff contract doc must accompany critical-path changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce contract-doc sync
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          git fetch origin "${base}" --depth=50 || true
          changed=$(git diff --name-only "origin/${base}...HEAD")
          critical_path_changed=false
          for path in \
            packages/genie-space-optimizer/src/genie_space_optimizer/optimization/failure_cluster.py \
            packages/genie-space-optimizer/src/genie_space_optimizer/optimization/cluster_driven_synthesis.py \
            packages/genie-space-optimizer/src/genie_space_optimizer/optimization/forced_synthesis_dispatch.py \
            ; do
            if echo "$changed" | grep -q "^${path}$"; then
              critical_path_changed=true
            fi
          done
          if [[ "$critical_path_changed" == "true" ]]; then
            if ! echo "$changed" | grep -q "^packages/genie-space-optimizer/docs/architecture/stage-handoff-contract.md$"; then
              echo "ERROR: PR modifies Phase 1 critical-path files but does not update"
              echo "  packages/genie-space-optimizer/docs/architecture/stage-handoff-contract.md"
              echo "  Per the Phase 1 contract, every change to the typed-contract"
              echo "  stages must keep the doc in sync. Add the doc to this PR or"
              echo "  document why the change is doc-neutral in the PR description."
              exit 1
            fi
          fi
