[project]
name = "genie-workbench"
version = "0.1.0"
description = "Unified Databricks Genie Agent management platform"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk==0.117.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "mlflow==3.11.1",
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "httpx==0.28.1",
    "requests==2.33.0",
    "asyncpg==0.31.0",
    "genie-space-optimizer",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[project.scripts]
start-server = "backend.main:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.workspace]
members = ["packages/genie-space-optimizer"]

[tool.uv.sources]
genie-space-optimizer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
# `e2e`/`slow` mark the opt-in live suite under tests/e2e (NOT in testpaths, so
# neither the default run nor ./scripts/test.sh collects it — the offline
# baseline is untouched). `integration` marks the VC live suite under
# backend/tests/integration (in testpaths, but excluded by default via addopts;
# run explicitly with `-m integration`). Registered here so explicit runs emit
# no PytestUnknownMarkWarning.
markers = [
    "e2e: live test against a real Databricks workspace (env-gated; opt-in)",
    "slow: spends real workspace/eval budget; serialized, never parallelized",
    "integration: requires explicit real nonproduction Databricks platform",
]
