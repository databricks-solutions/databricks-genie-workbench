bundle:
  name: "genie-space-optimizer"

variables:
  app_name:
    description: "Databricks App name (must be unique in your workspace)"
    default: "genie-space-optimizer"
  catalog:
    description: "Unity Catalog name for storing optimization state tables"
    default: "main"
  gold_schema:
    description: "Schema within the catalog for optimization tables"
    default: "genie_optimization"
  warehouse_id:
    description: "SQL Warehouse ID for query execution"
  deploy_profile:
    default: "DEFAULT"

sync:
  include:
    - .build
    - .build/**
    - src/genie_space_optimizer/jobs
    - src/genie_space_optimizer/jobs/**

artifacts:
  default:
    build: apx build && rm -f .build/.gitignore && python resources/patch_app_yml.py .build/app.yml --catalog ${var.catalog} --schema ${var.gold_schema} --warehouse-id ${var.warehouse_id} && cp .build/genie_space_optimizer-*.whl .build/genie_space_optimizer-0.0.0-py3-none-any.whl && echo "databricks-connect>=15.0.0" >> .build/requirements.txt

resources:
  apps:
    genie-space-optimizer-app:
      name: ${var.app_name}
      description: "genie-space-optimizer created with apx"
      source_code_path: ./.build
      user_api_scopes:
        - "dashboards.genie"
        - "files.files"
        - "catalog.catalogs:read"
        - "catalog.schemas:read"
        - "catalog.tables:read"
        - "sql"
      config:
        env:
          - name: GENIE_SPACE_OPTIMIZER_CATALOG
            value: ${var.catalog}
          - name: GENIE_SPACE_OPTIMIZER_SCHEMA
            value: ${var.gold_schema}
          - name: GENIE_SPACE_OPTIMIZER_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: GENIE_SPACE_OPTIMIZER_JOB_ID
            value: ${resources.jobs.genie-space-optimizer-runner.id}
      resources:
        - name: "sql-warehouse"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
      permissions:
        - user_name: "users"
          level: "CAN_USE"

  jobs:
    genie-space-optimizer-runner:
      name: "genie-space-optimizer-job"
      description: >-
        GSO v2 bounded hill-climbing runner managed by the Genie Space Optimizer app
        (00_intake_and_snapshot -> 01_benchmark_qc_and_repair -> 02_baseline_eval_and_triage
        -> 03_optimize -> publish_and_audit). Linear 5-task serverless DAG; the whole
        hill-climb runs as an in-process while-loop inside 03_optimize. No condition
        tasks, no dbutils.notebook.run, no inter-task task-value plumbing — every task
        reads job parameters + durable Delta state by run_id (D9). SP executes with
        granted privileges on user schemas.
      max_concurrent_runs: 20
      queue:
        enabled: true
      tags:
        app: "genie-space-optimizer"
        managed-by: "databricks-bundle"
        pattern: "linear-5task"
      parameters:
        - name: run_id
          default: ""
        - name: space_id
          default: ""
        - name: domain
          default: "default"
        - name: catalog
          default: ""
        - name: schema
          default: ""
        - name: apply_mode
          default: "genie_config"
        - name: levers
          default: "[1,2,3,4,5,6]"
        # Surgical hill-climb budget (counts surgical attempts only; the
        # attempt-1 coverage pass is a free probe — arch §12 / §13.5).
        - name: max_attempts
          default: "3"
        # Stop-early target accuracy (arch §12).
        - name: target_accuracy
          default: "0.90"
        # Bound on 01's inline benchmark repair/prune loop (arch §12).
        - name: benchmark_repair_max_tries
          default: "3"
        # Retained: still consumed by the existing _run_lever_loop that
        # 03_optimize temporarily delegates to (superseded by max_attempts
        # once the two-mode controller lands in Phase 8).
        - name: max_iterations
          default: "5"
        - name: triggered_by
          default: ""
        - name: warehouse_id
          default: ""
      tasks:
        # Every task carries the full job-parameter set as base_parameters so
        # there is NO inter-task task-value plumbing (D9). run_id/catalog/schema
        # bootstrap each notebook; all other handoff state is read from Delta by
        # run_id via the existing Delta-fallback handoff helpers.
        - task_key: 00_intake_and_snapshot
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_00_intake_and_snapshot.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              max_iterations: "{{job.parameters.max_iterations}}"
              triggered_by: "{{job.parameters.triggered_by}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: 01_benchmark_qc_and_repair
          depends_on:
            - task_key: 00_intake_and_snapshot
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_01_benchmark_qc_and_repair.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: 02_baseline_eval_and_triage
          depends_on:
            - task_key: 01_benchmark_qc_and_repair
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_02_baseline_eval_and_triage.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: 03_optimize
          depends_on:
            - task_key: 02_baseline_eval_and_triage
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_03_optimize.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              max_iterations: "{{job.parameters.max_iterations}}"
              triggered_by: "{{job.parameters.triggered_by}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: publish_and_audit
          depends_on:
            - task_key: 03_optimize
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_publish_and_audit.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - .build/genie_space_optimizer-0.0.0-py3-none-any.whl
      permissions:
        - group_name: "users"
          level: "CAN_VIEW"

targets:
  dev:
    mode: development
    default: true
