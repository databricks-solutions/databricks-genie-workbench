bundle:
  name: "genie-space-optimizer"

variables:
  catalog:
    description: "Unity Catalog name for storing optimization state tables"
    default: "main"
  gold_schema:
    description: "Schema within the catalog for optimization tables"
    default: "genie_optimization"
  warehouse_id:
    description: "SQL Warehouse ID for query execution"

sync:
  include:
    - .build
    - .build/**
    - src/genie_space_optimizer/jobs
    - src/genie_space_optimizer/jobs/**

artifacts:
  default:
    build: uv build --wheel --out-dir .build && cp .build/genie_space_optimizer-*.whl .build/genie_space_optimizer-0.0.0-py3-none-any.whl

resources:
  jobs:
    genie-space-optimizer-runner:
      name: "genie-space-optimizer-job"
      description: >-
        GSO v2 bounded hill-climbing runner managed by Genie Workbench
        (intake_and_snapshot -> benchmark_qc_and_repair -> optimize
        -> publish_and_audit). Linear 4-task serverless DAG; the baseline eval and
        hill-climb run as an in-process native Benchmark API loop inside optimize. No condition
        tasks, no dbutils.notebook.run, no inter-task task-value plumbing — every task
        reads job parameters + durable Delta state by run_id (D9). SP executes with
        granted privileges on user schemas.
      max_concurrent_runs: 20
      queue:
        enabled: true
      tags:
        app: "genie-space-optimizer"
        managed-by: "databricks-bundle"
        pattern: "linear-4task"
      parameters:
        - name: run_id
          default: ""
        - name: space_id
          default: ""
        - name: domain
          default: "default"
        - name: catalog
          default: ""
        - name: schema
          default: ""
        - name: apply_mode
          default: "genie_config"
        - name: levers
          default: "[1,2,3,4,5,6]"
        # Bounded LLM patch/eval attempt budget.
        - name: max_attempts
          default: "3"
        # Stop-early target accuracy.
        - name: target_accuracy
          default: "0.90"
        # Bound on benchmark_qc_and_repair's inline repair/prune loop.
        - name: benchmark_repair_max_tries
          default: "3"
        - name: benchmark_policy
          default: "repair_allowed"
        - name: triggered_by
          default: ""
        - name: warehouse_id
          default: ""
        - name: workload_warehouse_ids
          default: "[]"
        # Metric view advisor parameters (MV-D5 four-place lockstep). Only the
        # optimize task consumes them (run_optimize.py). enable_metric_view_suggestions
        # gates the advisor phase; mv_attach_views / mv_consent_id drive the MV-D16
        # attach phase; mv_action_mode / mv_min_confidence are declared-but-unconsumed
        # today (a later prompt wires them — see run_optimize.py and gap report §2.2).
        - name: enable_metric_view_suggestions
          default: "false"
        - name: mv_action_mode
          default: "suggest_only"
        - name: mv_attach_views
          default: ""
        - name: mv_consent_id
          default: ""
        - name: mv_min_confidence
          default: "75"
      tasks:
        # Every task carries the full job-parameter set as base_parameters so
        # there is NO inter-task task-value plumbing (D9). run_id/catalog/schema
        # bootstrap each notebook; all other handoff state is read from Delta by
        # run_id via the existing Delta-fallback handoff helpers.
        - task_key: intake_and_snapshot
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_intake_and_snapshot.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              triggered_by: "{{job.parameters.triggered_by}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              workload_warehouse_ids: "{{job.parameters.workload_warehouse_ids}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: benchmark_qc_and_repair
          depends_on:
            - task_key: intake_and_snapshot
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_benchmark_qc_and_repair.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: optimize
          depends_on:
            - task_key: benchmark_qc_and_repair
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_optimize.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              # Metric view advisor phase inputs (MV-D5). Passing these as
              # base_parameters is what makes the run_optimize.py widgets receive
              # real job values — a declared job parameter omitted here silently
              # resolves to the widget default (the trap Prompt 8 exists to close).
              enable_metric_view_suggestions: "{{job.parameters.enable_metric_view_suggestions}}"
              mv_action_mode: "{{job.parameters.mv_action_mode}}"
              mv_attach_views: "{{job.parameters.mv_attach_views}}"
              mv_consent_id: "{{job.parameters.mv_consent_id}}"
              mv_min_confidence: "{{job.parameters.mv_min_confidence}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: publish_and_audit
          depends_on:
            - task_key: optimize
          notebook_task:
            notebook_path: ./src/genie_space_optimizer/jobs/run_publish_and_audit.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - .build/genie_space_optimizer-0.0.0-py3-none-any.whl
      permissions:
        - group_name: "users"
          level: "CAN_VIEW"

targets:
  dev:
    mode: development
    default: true
