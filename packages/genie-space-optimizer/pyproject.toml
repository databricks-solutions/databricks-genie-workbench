[project]
name = "genie-space-optimizer"
dynamic = ["version"]
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.135.2",
    "pydantic-settings==2.13.1",
    "uvicorn==0.42.0",
    "databricks-sdk==0.102.0",
    "mlflow[databricks]==3.11.1",
    "openai==2.30.0",
    "litellm==1.82.6",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "pandas==2.3.3",
    "sqlmodel==0.0.37",
    "psycopg[binary,pool]==3.3.3",
    "sqlglot==30.0.3",
]

[project.optional-dependencies]
# databricks-connect ships separate wheels for Python <3.12 and >=3.12;
# both are pinned exactly via PEP 508 environment markers so the
# resolution stays exact under any supported interpreter.
spark = [
    "databricks-connect==16.1.7; python_version < '3.12'",
    "databricks-connect==18.0.3; python_version >= '3.12'",
]

[dependency-groups]
dev = [
    "ty==0.0.25",
    "pytest==9.0.2",
    "httpx==0.28.1",
    "hypothesis==6.152.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.src]
include = ["src/**"]
exclude = [
    "genie_space_optimizer/genie_optimizer_skills/**",
    ".venv/**",
]

[[tool.ty.overrides]]
include = ["src/genie_space_optimizer/optimization/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.apx.metadata]
app-name = "genie-space-optimizer"
app-slug = "genie_space_optimizer"
app-entrypoint = "genie_space_optimizer.backend.app:app"
api-prefix = "/api/genie"
metadata-path = "src/genie_space_optimizer/_metadata.py"

[tool.apx.ui]
root = "src/genie_space_optimizer/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling==1.29.0", "uv-dynamic-versioning==0.13.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[[tool.uv.index]]
name = "databricks-proxy"
url = "https://pypi-proxy.dev.databricks.com/simple/"
default = true

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.version]
path = "src/genie_space_optimizer/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/genie_space_optimizer/__dist__", "src/genie_space_optimizer/_metadata.py"]
exclude = ["src/genie_space_optimizer/ui"]
