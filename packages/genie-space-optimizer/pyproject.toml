[project]
name = "genie-space-optimizer"
dynamic = ["version"]
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk==0.117.0",
    "mlflow[databricks]==3.11.1",
    "openai==2.30.0",
    "litellm==1.82.6",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "pandas==2.3.3",
    "sqlglot==30.0.3",
    "leidenalg==0.12.0",
    "igraph==1.0.0",
]

[project.optional-dependencies]
# databricks-connect ships separate wheels for Python <3.12 and >=3.12;
# both are pinned exactly via PEP 508 environment markers so the
# resolution stays exact under any supported interpreter.
spark = [
    "databricks-connect==16.1.7; python_version < '3.12'",
    "databricks-connect==18.0.3; python_version >= '3.12'",
]

[dependency-groups]
dev = [
    "ty==0.0.25",
    "pytest==9.0.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.src]
include = ["src/**"]
exclude = [".venv/**"]

[[tool.ty.overrides]]
include = ["src/genie_space_optimizer/optimization/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[build-system]
requires = ["hatchling==1.29.0", "uv-dynamic-versioning==0.13.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.version]
path = "src/genie_space_optimizer/_version.py"
template = '''
version = "{version}"
'''
