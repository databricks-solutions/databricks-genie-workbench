bundle:
  name: "genie-workbench"
  databricks_cli_version: ">= 0.297.2"

variables:
  app_name:
    description: "Databricks App name (must be unique in your workspace)"
    default: "genie-workbench"
  catalog:
    description: "Unity Catalog name for GSO optimization state tables (must have CREATE SCHEMA permission)"
  warehouse_id:
    description: "SQL Warehouse ID for query execution"
  llm_model:
    description: "LLM serving endpoint name"
    default: "databricks-claude-sonnet-4-6"

sync:
  include:
    - .build
    - .build/**
    - dashboards/**
    - packages/genie-space-optimizer/src/genie_space_optimizer/jobs
    - packages/genie-space-optimizer/src/genie_space_optimizer/jobs/**
  exclude:
    - backend/**
    - frontend/**
    - tests/**
    - sql/**
    - TODO/**
    - packages/genie-space-optimizer/tests/**
    - packages/genie-space-optimizer/src/genie_space_optimizer/backend/**
    - packages/genie-space-optimizer/node_modules/**
    - packages/genie-space-optimizer/.build/**

artifacts:
  default:
    build: |
      rm -f .build/genie_space_optimizer-*.whl && cd packages/genie-space-optimizer && uv run --with build python -m build --wheel -o ../../.build/ && cd ../.. && cp .build/genie_space_optimizer-*.whl .build/genie_space_optimizer-0.0.0-py3-none-any.whl

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
# The app resource is NOT bundle-managed — deploy.sh handles app creation,
# config patching (GSO_JOB_ID, GSO_CATALOG, etc.), and apps deploy.
# Only the optimization job is managed by the bundle.
# ---------------------------------------------------------------------------
resources:
  jobs:
    gso-optimization-runner:
      name: "gso-optimization-job"
      description: >-
        GSO v2 bounded hill-climbing runner managed by Genie Workbench
        (intake_and_snapshot -> benchmark_qc_and_repair ->
        optimize -> publish_and_audit).
        Linear 4-task serverless DAG; the baseline eval and hill-climb run as an
        in-process native Benchmark API loop inside optimize. No condition tasks, no dbutils.notebook.run,
        no inter-task task-value plumbing — every task reads job parameters +
        durable Delta state by run_id (D9). SP executes with granted privileges
        on user schemas.
      max_concurrent_runs: 20
      queue:
        enabled: true
      tags:
        app: "genie-workbench"
        managed-by: "databricks-bundle"
        pattern: "persistent-dag"
      # Parameter set mirrors the package bundle
      # (packages/genie-space-optimizer/databricks.yml) 4-task job. `llm_model`
      # is the Workbench-specific extra: deploy.sh passes it via
      # `--var llm_model` so the operator-selected serving endpoint reaches each
      # task (every v2 entrypoint honors the llm_model widget). MLflow was
      # decommissioned (Phase 5) so `experiment_name` is gone, and `deploy` is
      # out of scope (D7) so `deploy_target` is gone.
      parameters:
        - name: run_id
          default: ""
        - name: space_id
          default: ""
        - name: domain
          default: "default"
        - name: catalog
          default: ""
        - name: schema
          default: ""
        - name: apply_mode
          default: "genie_config"
        - name: levers
          default: "[1,2,3,4,5,6]"
        # Bounded LLM patch/eval attempt budget.
        - name: max_attempts
          default: "3"
        # Stop-early target accuracy.
        - name: target_accuracy
          default: "0.90"
        # Bound on benchmark_qc_and_repair's inline repair/prune loop.
        - name: benchmark_repair_max_tries
          default: "3"
        # Backward-compatible job default. The Workbench UI explicitly sends
        # review_only unless the operator opts into live benchmark repair.
        - name: benchmark_policy
          default: "repair_allowed"
        - name: triggered_by
          default: ""
        - name: warehouse_id
          default: ""
        - name: workload_warehouse_ids
          default: "[]"
        - name: llm_model
          default: ${var.llm_model}
        # Metric view advisor parameters (MV-D5 four-place lockstep). Only the
        # optimize task consumes them (run_optimize.py). enable_metric_view_suggestions
        # gates the advisor phase; mv_attach_views / mv_consent_id drive the MV-D16
        # attach phase; mv_action_mode / mv_min_confidence are declared-but-unconsumed
        # today (a later prompt wires them — see run_optimize.py and gap report §2.2).
        - name: enable_metric_view_suggestions
          default: "false"
        - name: mv_action_mode
          default: "suggest_only"
        - name: mv_attach_views
          default: ""
        - name: mv_consent_id
          default: ""
        - name: mv_min_confidence
          default: "75"
      # Every task carries its job-parameter subset as base_parameters so there
      # is NO inter-task task-value plumbing (D9). run_id/catalog/schema
      # bootstrap each notebook; all other handoff state is read from Delta by
      # run_id. This mirrors the package bundle; `llm_model` is added to every
      # task (Workbench-specific — see the parameter note above).
      tasks:
        - task_key: intake_and_snapshot
          notebook_task:
            notebook_path: ./packages/genie-space-optimizer/src/genie_space_optimizer/jobs/run_intake_and_snapshot.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              triggered_by: "{{job.parameters.triggered_by}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              workload_warehouse_ids: "{{job.parameters.workload_warehouse_ids}}"
              llm_model: "{{job.parameters.llm_model}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: benchmark_qc_and_repair
          depends_on:
            - task_key: intake_and_snapshot
          notebook_task:
            notebook_path: ./packages/genie-space-optimizer/src/genie_space_optimizer/jobs/run_benchmark_qc_and_repair.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              benchmark_repair_max_tries: "{{job.parameters.benchmark_repair_max_tries}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              llm_model: "{{job.parameters.llm_model}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: optimize
          depends_on:
            - task_key: benchmark_qc_and_repair
          notebook_task:
            notebook_path: ./packages/genie-space-optimizer/src/genie_space_optimizer/jobs/run_optimize.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              levers: "{{job.parameters.levers}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              llm_model: "{{job.parameters.llm_model}}"
              # Metric view advisor phase inputs (MV-D5). Passing these as
              # base_parameters is what makes the run_optimize.py widgets receive
              # real job values — a declared job parameter omitted here silently
              # resolves to the widget default (the trap Prompt 8 exists to close).
              enable_metric_view_suggestions: "{{job.parameters.enable_metric_view_suggestions}}"
              mv_action_mode: "{{job.parameters.mv_action_mode}}"
              mv_attach_views: "{{job.parameters.mv_attach_views}}"
              mv_consent_id: "{{job.parameters.mv_consent_id}}"
              mv_min_confidence: "{{job.parameters.mv_min_confidence}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
        - task_key: publish_and_audit
          depends_on:
            - task_key: optimize
          notebook_task:
            notebook_path: ./packages/genie-space-optimizer/src/genie_space_optimizer/jobs/run_publish_and_audit.py
            base_parameters:
              run_id: "{{job.parameters.run_id}}"
              space_id: "{{job.parameters.space_id}}"
              domain: "{{job.parameters.domain}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              apply_mode: "{{job.parameters.apply_mode}}"
              target_accuracy: "{{job.parameters.target_accuracy}}"
              max_attempts: "{{job.parameters.max_attempts}}"
              benchmark_policy: "{{job.parameters.benchmark_policy}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              llm_model: "{{job.parameters.llm_model}}"
          environment_key: default
          timeout_seconds: 14400
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - .build/genie_space_optimizer-0.0.0-py3-none-any.whl

    # Ontology materialize (Phase 2, MV-D41) — nightly + on-demand. Snapshots the
    # governed-tag graph + Domain/Sub-Domain taxonomy to Delta so the Ontology
    # page reads a stable, sub-second mirror (with a live fallback). Read-only
    # w.r.t. UC governance: the ONLY UC writes are the genie_ont_* Delta MERGEs —
    # no governed-tag DDL. deploy.sh injects GSO_ONT_JOB_ID into app.yaml from
    # bundle state, exactly like GSO_JOB_ID.
    ontology-materialize-runner:
      name: "genie-ontology-materialize-job"
      description: >-
        Materializes the estate ontology (governed-tag graph + taxonomy) to Delta
        on a nightly schedule and on demand. Reads system tables as the SP, applies
        the same pure transforms the page uses live, and MERGEs the genie_ont_*
        snapshot tables idempotently. Writes NOTHING to Unity Catalog governance.
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tags:
        app: "genie-workbench"
        managed-by: "databricks-bundle"
        pattern: "ontology-materialize"
      parameters:
        - name: workspace_id
          default: ""
        - name: trigger
          default: "nightly"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: "genie_space_optimizer"
        - name: catalog_allowlist
          default: "[]"
        - name: run_id
          default: ""
      tasks:
        - task_key: ontology_materialize
          notebook_task:
            notebook_path: ./packages/genie-space-optimizer/src/genie_space_optimizer/jobs/run_ontology_materialize.py
            base_parameters:
              workspace_id: "{{job.parameters.workspace_id}}"
              trigger: "{{job.parameters.trigger}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              catalog_allowlist: "{{job.parameters.catalog_allowlist}}"
              run_id: "{{job.parameters.run_id}}"
          environment_key: default
          timeout_seconds: 3600
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - .build/genie_space_optimizer-0.0.0-py3-none-any.whl

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
# - dev:          Personal development (mode: development adds [dev user] prefix)
# - app:          Deploy via deploy.sh — mode: development for per-deployer
#                 Terraform state, but name_prefix: "" for clean resource names.
#                 run_as is NOT set here; the app self-heals it at startup
#                 (avoids needing servicePrincipal.user role on the deployer).
# - dev-lakebase: Development with Lakebase provisioning
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
  app:
    mode: development
    presets:
      name_prefix: ""
  dev-lakebase:
    mode: development
    resources:
      postgres_projects:
        genie-workbench-db:
          project_id: ${var.app_name}-db
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 4
            suspend_timeout_duration: "3600s"
